<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="csr-wall" x1="0" y1="0" x2="1" y2=".08">
      <stop offset="0" stop-color="#8b796a"/>
      <stop offset=".28" stop-color="#9f8d78"/>
      <stop offset=".62" stop-color="#9b8975"/>
      <stop offset="1" stop-color="#786d69"/>
    </linearGradient>
    <linearGradient id="csr-upper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b2a28a"/>
      <stop offset="1" stop-color="#988671"/>
    </linearGradient>
    <linearGradient id="csr-wainscot" x1="0" y1="0" x2="1" y2=".1">
      <stop offset="0" stop-color="#4a3328"/>
      <stop offset=".35" stop-color="#604131"/>
      <stop offset=".72" stop-color="#593b2e"/>
      <stop offset="1" stop-color="#3c2e2a"/>
    </linearGradient>
    <linearGradient id="csr-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b4234"/>
      <stop offset=".52" stop-color="#453127"/>
      <stop offset="1" stop-color="#29201e"/>
    </linearGradient>
    <linearGradient id="csr-rug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f393d"/>
      <stop offset=".55" stop-color="#65353a"/>
      <stop offset="1" stop-color="#4c3034"/>
    </linearGradient>
    <radialGradient id="csr-warm-pool" cx=".58" cy=".35" r=".72">
      <stop offset="0" stop-color="#f0d7ad" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#d4b17f" stop-opacity=".08"/>
      <stop offset="1" stop-color="#8b6d55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="csr-window-wash" x1="1" y1="0" x2=".1" y2="1">
      <stop offset="0" stop-color="#c8d8d5" stop-opacity=".15"/>
      <stop offset=".6" stop-color="#afc2c0" stop-opacity=".07"/>
      <stop offset="1" stop-color="#afc2c0" stop-opacity="0"/>
    </linearGradient>
    <pattern id="csr-plaster" width="211" height="173" patternUnits="userSpaceOnUse">
      <path d="M18 39q31-9 57 2M112 24q25 7 51-1M58 112q20-8 41 2M142 135q24-5 43 4" fill="none" stroke="#efe2cd" stroke-width="2" opacity=".035"/>
      <path d="M31 78q18 7 33 1M101 82q27-6 47 0M173 63q14 5 25-2" fill="none" stroke="#4f443d" stroke-width="2" opacity=".045"/>
      <circle cx="188" cy="147" r="1.5" fill="#3b332f" opacity=".06"/>
      <circle cx="83" cy="52" r="1.1" fill="#f4ead8" opacity=".055"/>
    </pattern>
    <pattern id="csr-rug-weave" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 5H24M0 18H24M6 0V24M18 0V24" stroke="#c19a6d" stroke-width=".7" opacity=".05"/>
    </pattern>
    <filter id="csr-soft" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="csr-soft-wide" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#382b27"/>
  <rect width="1600" height="124" fill="url(#csr-upper)"/>
  <rect y="108" width="1600" height="480" fill="url(#csr-wall)"/>
  <rect y="108" width="1600" height="480" fill="url(#csr-plaster)"/>

  <!-- Belle Époque architectural order: social, not palatial. -->
  <path d="M0 118H1600" stroke="#3b2b25" stroke-width="13" opacity=".62"/>
  <path d="M0 132H1600" stroke="#b69767" stroke-width="3" opacity=".42"/>
  <path d="M0 470H1600" stroke="#6b4c37" stroke-width="8" opacity=".38"/>
  <rect y="482" width="1600" height="108" fill="url(#csr-wainscot)"/>
  <path d="M0 482H1600M0 577H1600" stroke="#261f1d" stroke-width="8" opacity=".42"/>
  <path d="M0 489H1600M0 565H1600" stroke="#aa8251" stroke-width="2" opacity=".28"/>

  <!-- restrained wall-panel rhythm; no fake doors or courtroom symmetry -->
  <g fill="none" stroke-linejoin="round">
    <rect x="365" y="178" width="278" height="238" rx="2" stroke="#6d5b4b" stroke-width="8" opacity=".38"/>
    <rect x="379" y="192" width="250" height="210" rx="2" stroke="#c4aa79" stroke-width="2" opacity=".28"/>
    <rect x="688" y="172" width="300" height="246" rx="2" stroke="#6d5b4b" stroke-width="8" opacity=".36"/>
    <rect x="703" y="187" width="270" height="216" rx="2" stroke="#c4aa79" stroke-width="2" opacity=".27"/>
    <rect x="1030" y="176" width="176" height="238" rx="2" stroke="#6d5b4b" stroke-width="8" opacity=".30"/>
    <rect x="1044" y="190" width="148" height="210" rx="2" stroke="#c4aa79" stroke-width="2" opacity=".24"/>
  </g>

  <!-- modest gilt accents: aged, peripheral -->
  <g opacity=".56">
    <!-- mismatched inherited pieces: domestic history rather than hotel symmetry -->
    <path d="M454 226h96v116h-96z" fill="#5b493a" stroke="#987747" stroke-width="7"/>
    <path d="M465 237h74v94h-74z" fill="#665d56"/>
    <ellipse cx="503" cy="274" rx="16" ry="21" fill="#7a6d62" opacity=".52"/>
    <path d="M482 315q22-31 43-3" fill="none" stroke="#9b9082" stroke-width="3" opacity=".38"/>
    <path d="M758 248h144v84H758z" fill="#5d4b3d" stroke="#8f7044" stroke-width="7"/>
    <path d="M770 260h120v60H770z" fill="#786e61"/>
    <path d="M775 304q30-34 54-9t55-2" fill="none" stroke="#a79c8d" stroke-width="3" opacity=".38"/>
    <path d="M779 281q29 10 52-5t52 4" fill="none" stroke="#5b6a66" stroke-width="3" opacity=".30"/>
  </g>

  <!-- sconces add lived-in warmth without creating spotlights -->
  <g opacity=".76">
    <path d="M667 250v70m-13-49h26m-18 0-20 22m30-22 20 22" fill="none" stroke="#8a6d42" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="642" cy="292" rx="28" ry="44" fill="#d0a86c" opacity=".06" filter="url(#csr-soft)"/>
    <path d="M1017 245v68m-13-48h26m-18 0-20 22m30-22 20 22" fill="none" stroke="#84683f" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="992" cy="286" rx="28" ry="44" fill="#d0a86c" opacity=".055" filter="url(#csr-soft)"/>
  </g>

  <!-- texture kept broad so the room never reads as wallpaper -->
  <g fill="none" stroke-linecap="round">
    <path d="M399 447q73-15 136 0M754 448q64 10 124-1M1084 447q49-9 90 2" stroke="#3f3733" stroke-width="3" opacity=".08"/>
    <path d="M579 158q34 5 61-2M923 144q41-6 79 3" stroke="#f2e4ce" stroke-width="2" opacity=".055"/>
  </g>

  <!-- floor and rug -->
  <polygon points="0,588 1600,588 1600,900 0,900" fill="url(#csr-floor)"/>
  <g fill="none" stroke-linecap="round">
    <path d="M110 588L35 900M326 588L290 900M542 588L540 900M758 588L790 900M974 588L1042 900M1190 588L1295 900M1406 588L1545 900" stroke="#8f6c52" stroke-width="3" opacity=".15"/>
    <path d="M0 650H1600M0 721H1600M0 800H1600" stroke="#241b19" stroke-width="3" opacity=".20"/>
  </g>
  <polygon points="340,602 1270,602 1380,824 250,824" fill="url(#csr-rug)" stroke="#3b2426" stroke-width="9"/>
  <polygon points="340,602 1270,602 1380,824 250,824" fill="url(#csr-rug-weave)"/>
  <polygon points="375,626 1235,626 1334,799 296,799" fill="none" stroke="#a07a55" stroke-width="5" opacity=".38"/>
  <polygon points="399,646 1213,646 1298,780 330,780" fill="none" stroke="#3f2b2e" stroke-width="3" opacity=".40"/>
  <path d="M474 662q118-12 218 1m350 99q112 8 203-2" fill="none" stroke="#c8a071" stroke-width="3" opacity=".06"/>

  <!-- empty architectural wells behind runtime-separated fireplace/window -->
  <rect x="74" y="170" width="270" height="386" rx="4" fill="#6f5e54" opacity=".28"/>
  <rect x="1250" y="100" width="285" height="470" rx="5" fill="#665d5b" opacity=".18"/>

  <!-- ambient light strategy -->
  <rect y="108" width="1600" height="480" fill="url(#csr-warm-pool)"/>
  <path d="M1260 126L1530 126 1434 780 1085 780Z" fill="url(#csr-window-wash)"/>
  <ellipse cx="1080" cy="525" rx="330" ry="190" fill="#d8bc91" opacity=".045" filter="url(#csr-soft-wide)"/>
  <ellipse cx="1320" cy="618" rx="190" ry="140" fill="#b8c9c7" opacity=".045" filter="url(#csr-soft-wide)"/>

  <!-- actor-readability shaping: broad values, never character spotlights -->
  <path d="M770 406Q1020 360 1260 420L1278 592H747Z" fill="#ead4b0" opacity=".035"/>
  <path d="M1220 410Q1405 390 1535 455L1512 610H1210Z" fill="#d5e0dd" opacity=".035"/>
  <ellipse cx="845" cy="760" rx="255" ry="70" fill="#161315" opacity=".07" filter="url(#csr-soft)"/>

  <!-- peripheral furniture silhouettes only; no walk-band obstruction -->
  <g transform="translate(0 0)" stroke="#2c211d" stroke-width="6" stroke-linejoin="round" opacity=".82">
    <path d="M32 548h86v38H32z" fill="#4d3329"/>
    <path d="M42 584l-11 73m74-73 13 73" fill="none"/>
  </g>
  <g transform="translate(1482 0)" stroke="#2b211e" stroke-width="6" stroke-linejoin="round" opacity=".72">
    <path d="M0 553h82v35H0z" fill="#49322a"/>
    <path d="M10 586L1 653m69-67 10 67" fill="none"/>
  </g>

  <!-- lower vignette keeps the open dialogue band visually calm -->
  <path d="M0 805Q800 760 1600 810V900H0Z" fill="#151214" opacity=".055"/>
</svg>