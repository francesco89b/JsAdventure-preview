<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="900" viewBox="0 0 1680 900">
  <defs>
    <linearGradient id="yr-ceiling" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d0c5ad"/>
      <stop offset=".72" stop-color="#b7a27c"/>
      <stop offset="1" stop-color="#978063"/>
    </linearGradient>
    <linearGradient id="yr-wall" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#84653f"/>
      <stop offset=".22" stop-color="#967747"/>
      <stop offset=".56" stop-color="#9b7d4d"/>
      <stop offset=".78" stop-color="#8d7551"/>
      <stop offset="1" stop-color="#70675a"/>
    </linearGradient>
    <linearGradient id="yr-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#635044"/>
      <stop offset=".55" stop-color="#493a34"/>
      <stop offset="1" stop-color="#312929"/>
    </linearGradient>
    <linearGradient id="yr-rug" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6249"/>
      <stop offset=".55" stop-color="#715642"/>
      <stop offset="1" stop-color="#5f493d"/>
    </linearGradient>
    <pattern id="yr-plaster" width="171" height="137" patternUnits="userSpaceOnUse">
      <path d="M9 22q13-7 28-1M71 13q9 5 18 1M126 35q12-5 27 3M31 91q14 4 24-2M96 112q17-8 31 1M145 78q8 4 16 0" fill="none" stroke="#f0ddae" stroke-opacity=".05" stroke-width="2"/>
      <path d="M54 47q6 9 16 6M116 64q10 5 19-2M18 123q12-4 21 1" fill="none" stroke="#4a433b" stroke-opacity=".055" stroke-width="2"/>
      <circle cx="151" cy="18" r="1.4" fill="#403a34" opacity=".07"/>
      <circle cx="82" cy="82" r="1.1" fill="#fff9e7" opacity=".055"/>
      <circle cx="22" cy="58" r=".9" fill="#403a34" opacity=".06"/>
    </pattern>
    <pattern id="yr-rug-weave" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M0 4H18M0 13H18M4 0V18M13 0V18" stroke="#d0ae70" stroke-width=".8" opacity=".07"/>
    </pattern>
    <filter id="yr-soft" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Decorative overscan only. Interactive B2 occupies master x=40..1640. -->
  <rect width="1680" height="900" fill="#917d61"/>

  <g transform="translate(40 0)">
    <!-- compact room shell -->
    <rect width="1600" height="900" fill="#917d61"/>
    <rect x="0" y="0" width="1600" height="147" fill="url(#yr-ceiling)"/>
    <rect x="70" y="85" width="1460" height="565" fill="url(#yr-wall)"/>
    <rect x="70" y="85" width="1460" height="565" fill="url(#yr-plaster)"/>

    <!-- restrained architectural rhythm, explicitly not false openings -->
    <path d="M70 145H1530" stroke="#5d4d3c" stroke-width="11" opacity=".42"/>
    <path d="M70 159H1530" stroke="#ccb17d" stroke-width="3" opacity=".30"/>
    <path d="M70 602H1530" stroke="#59483a" stroke-width="12" opacity=".58"/>
    <path d="M70 588H1530" stroke="#c4a778" stroke-width="3" opacity=".22"/>
    <path d="M70 618H1530" stroke="#332d2a" stroke-width="8" opacity=".52"/>

    <!-- worn plaster: broad, low-frequency marks only -->
    <g fill="none" stroke-linecap="round">
      <path d="M338 244q39-15 83-4t78-7" stroke="#4c443c" stroke-width="3" opacity=".10"/>
      <path d="M864 178q42 12 82-2" stroke="#4c443c" stroke-width="3" opacity=".085"/>
      <path d="M107 548q58 14 101-5" stroke="#4c443c" stroke-width="3" opacity=".11"/>
      <path d="M1462 536q-33 11-58-1" stroke="#45423d" stroke-width="3" opacity=".10"/>
      <path d="M522 336q17 6 32 0m-4 1q9 10 19 7" stroke="#efe0bd" stroke-width="2" opacity=".06"/>
    </g>
    <g fill="#d7bd88" opacity=".055">
      <path d="M407 197q88-19 155 11l-16 61q-74 16-145-4z"/>
      <path d="M836 454q94-15 158 13l-11 78q-79 13-152-8z"/>
      <path d="M119 291q58-13 101 5l-7 82q-51 10-101-4z"/>
    </g>

    <!-- left threshold zone: shadowed enough to frame entry, not a hero -->
    <rect x="45" y="145" width="34" height="540" fill="#302a29"/>
    <path d="M79 167h20v478H79z" fill="#4b3b31" opacity=".62"/>
    <path d="M78 648q75 17 160 6l-3 47q-84 7-157-10z" fill="#221f20" opacity=".17" filter="url(#yr-soft)"/>

    <!-- floor kept shallow and readable -->
    <polygon points="70,650 1530,650 1600,900 0,900" fill="url(#yr-floor)"/>
    <g stroke-linecap="round" fill="none">
      <path d="M148 650L42 900M353 650L310 900M560 650L568 900M770 650L826 900M980 650L1084 900M1195 650L1345 900M1408 650L1575 900" stroke="#967761" stroke-width="3" opacity=".18"/>
      <path d="M35 705H1565M20 769H1583M8 838H1594" stroke="#271f20" stroke-width="3" opacity=".22"/>
      <path d="M185 683q98-10 181 0m682 111q142-13 270 2" stroke="#c39b78" stroke-width="3" opacity=".07"/>
    </g>

    <!-- big yellow mat: weathered, not saturated -->
    <polygon points="300,620 1275,620 1380,830 195,830" fill="url(#yr-rug)" stroke="#493832" stroke-width="8"/>
    <polygon points="300,620 1275,620 1380,830 195,830" fill="url(#yr-rug-weave)"/>
    <polygon points="328,643 1244,643 1336,807 237,807" fill="none" stroke="#ae8d5d" stroke-width="7" opacity=".54"/>
    <polygon points="352,661 1222,661 1300,790 270,790" fill="none" stroke="#4a3d34" stroke-width="3" opacity=".31"/>
    <path d="M478 657q77 8 146-2m412 122q87 6 163-4M340 742q54-7 101 0" fill="none" stroke="#d4b777" stroke-width="4" opacity=".09"/>

    <!-- cool daylight crosses the room but does not spotlight any clue -->
    <path d="M1236 455L1481 455 1371 835 1040 835Z" fill="#b7cfce" opacity=".085"/>
    <path d="M1282 476L1442 476 1353 820 1118 820Z" fill="#d9e1d9" opacity=".055" filter="url(#yr-soft)"/>

    <!-- static chair, left: ordinary and worn -->
    <g transform="translate(0 0)" stroke="#2a2421" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <rect x="310" y="645" width="72" height="58" rx="4" fill="#513b31"/>
      <path d="M315 648V607M377 648V607M324 703L315 772M367 703L376 772" fill="none"/>
      <path d="M319 623H373" stroke="#84634b" stroke-width="4" opacity=".42"/>
      <rect x="318" y="654" width="56" height="37" rx="3" fill="#665044" opacity=".78" stroke="none"/>
    </g>

    <!-- static chair, right -->
    <g transform="rotate(18 1160 700)" stroke="#2a2421" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <rect x="1120" y="646" width="80" height="58" rx="4" fill="#503a30"/>
      <path d="M1128 650V608M1192 650V608M1135 704L1125 780M1185 704L1195 780" fill="none"/>
      <path d="M1133 624H1187" stroke="#826149" stroke-width="4" opacity=".40"/>
      <rect x="1129" y="655" width="62" height="37" rx="3" fill="#655044" opacity=".76" stroke="none"/>
    </g>

    <!-- gentle floor falloff keeps Rouletabille readable without a spotlight -->
    <path d="M170 620Q790 555 1435 622L1530 900H40Z" fill="#0e1214" opacity=".035"/>
    <ellipse cx="810" cy="844" rx="710" ry="58" fill="#161416" opacity=".07" filter="url(#yr-soft)"/>
  </g>

  <!-- Overscan intentionally inherits the same edge field as B2: no side-band signature. -->
</svg>