      <stop offset="1" stop-color="#0d0905"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9dcbc"/>
      <stop offset="1" stop-color="#cdb98f"/>
