  <text x="1000" y="760" text-anchor="middle" font-family="Georgia, serif" font-size="58" fill="#fff6dc" opacity="0.35">PAPETERIE · PARIS</text>
  <!-- Lens rim -->
  <circle cx="1000" cy="620" r="300" fill="none" stroke="#b08a4a" stroke-width="22" opacity="0.8"/>
